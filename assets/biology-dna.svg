    <linearGradient id="coral" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#ffd49b"/><stop offset=".5" stop-color="#ee8740"/><stop offset="1" stop-color="#aa451e"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c1e9dc"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#ffd5aa"/></linearGradient>
    <filter id="depth" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#1c5743" flood-opacity=".17"/></filter>
